<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#001964">
    <meta name="description" content="Offline-first GPS field notes for VES surveys.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script src="./vendor/qrcode-generator.js" defer></script>
    <script src="./vendor/jsqr.min.js" defer></script>
    <script src="./app.js" defer></script>
    <title>VES Field</title>
  </head>
  <body>
    <div class="app-shell">
      <div id="app-actions" class="app-actions" aria-live="polite" hidden>
        <div id="update-banner" class="app-banner" hidden>
          <span>Update available</span>
          <button id="update-button" class="button button-primary update-button" type="button">Update</button>
          <button id="dismiss-update" class="banner-dismiss" type="button" aria-label="Dismiss update notification">×</button>
        </div>
        <div id="install-banner" class="app-banner" hidden>
          <span>Install VES Field</span>
          <button id="install-button" class="button button-primary install-button" type="button">Install</button>
          <button id="dismiss-install" class="banner-dismiss" type="button" aria-label="Dismiss install notification">×</button>
        </div>
      </div>
      <main id="app" class="main-content" aria-live="polite"></main>
      <footer class="app-footer">
        <a class="brand" href="./" aria-label="VES Field home">VES FIELD</a>
        <span id="connection-status" class="connection-status"><span class="status-dot"></span> Offline ready</span>
        <span id="app-version">App version unavailable</span>
      </footer>
    </div>
    <input id="import-file" type="file" accept=".json,application/json,.txt,text/plain" hidden>
    <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  </body>
</html>
